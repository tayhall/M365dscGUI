name: 'M365DSC - Export Dev tenant'

trigger: none

# Dev's tenant, Key Vault and app id are in pipelines/config/Dev.psd1, read by the script.
parameters:
  - name: workloads
    displayName: Workloads (DSC prefixes, comma separated)
    type: string
    default: 'AAD,Intune,EXO,Teams'

pool:
  name: '__POOL__'   # needs pwsh 7.6+ and local admin

jobs:
  - job: ExportDev
    timeoutInMinutes: 180
    steps:
      - checkout: self

      - pwsh: |
          & '$(Build.SourcesDirectory)/pipelines/scripts/Install-PipelineDependencies.ps1'
        displayName: Install PowerShell modules

      - task: AzurePowerShell@5
        displayName: Export Dev
        inputs:
          azureSubscription: '__SERVICE_CONNECTION__'
          azurePowerShellVersion: LatestVersion
          pwsh: true
          ScriptType: InlineScript
          Inline: |
            & '$(Build.SourcesDirectory)/pipelines/scripts/Invoke-PipelineExport.ps1' -Environment Dev -Workloads $env:PE_WORKLOADS -OutputPath '$(Build.ArtifactStagingDirectory)/export'
        env:
          PE_WORKLOADS: ${{ parameters.workloads }}

      - publish: $(Build.ArtifactStagingDirectory)/export
        artifact: DevExport
