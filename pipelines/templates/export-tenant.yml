# Shared steps: export one tenant with Microsoft365DSC and publish the result as an artifact.
# The tenant's identifiers (domain, Key Vault, short name, app id) come from pipelines/config/<environment>.psd1 at run time.
parameters:
  - name: environment         # Dev | PreProd: names the config file and the tenant
    type: string
    values:
      - Dev
      - PreProd
  - name: serviceConnection
    type: string
  - name: workloads           # comma-joined DSC name prefixes, for example AAD,Intune,EXO,Teams
    type: string
  - name: artifactName
    type: string

steps:
  - checkout: self

  - template: install-dependencies.yml

  # Az PowerShell is already signed in through the service connection.
  - task: AzurePowerShell@5
    displayName: 'Sign in app: import Reader certificate (${{ parameters.environment }})'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      azurePowerShellVersion: LatestVersion
      pwsh: true
      ScriptType: InlineScript
      Inline: |
        & '$(Build.SourcesDirectory)/pipelines/scripts/Connect-PipelineTenant.ps1' -Environment '${{ parameters.environment }}' -Role Reader

  - pwsh: |
      # The workloads come in through the environment and are validated, never written into the script text.
      if ($env:PE_WORKLOADS -notmatch '^[A-Za-z0-9,]+$') { throw 'The workloads parameter may only hold letters, digits and commas.' }
      $out = Join-Path '$(Build.ArtifactStagingDirectory)' 'export'
      & '$(Build.SourcesDirectory)/tools/Export-M365DscTenant.ps1' -Role Reader -Tenant '${{ lower(parameters.environment) }}' -Workloads $env:PE_WORKLOADS -OutputPath $out
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
    displayName: 'Export ${{ parameters.environment }} (Microsoft365DSC)'
    env:
      PE_WORKLOADS: ${{ parameters.workloads }}

  # Always runs, so a failed export does not leave the tenant certificate on the agent.
  - pwsh: '& "$(Build.SourcesDirectory)/pipelines/scripts/Disconnect-PipelineTenant.ps1" -Slug "${{ lower(parameters.environment) }}" -Role Reader'
    displayName: 'Remove ${{ parameters.environment }} certificate from the agent'
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish ${{ parameters.artifactName }}'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/export'
      artifact: ${{ parameters.artifactName }}
      publishLocation: pipeline
