name: 'M365DSC - Apply compared MOF files to Dev'

trigger: none

# Applies what "M365DSC - Compare PreProd to Dev and build MOFs" produced. DEV ONLY: nothing here can target another tenant.
resources:
  pipelines:
    - pipeline: compare
      source: '__COMPARE_PIPELINE__'

variables:
  - name: SERVICECONNECTION
    value: '__SERVICE_CONNECTION__'
  - name: KEYVAULT_NAME
    value: '__DEV_KEYVAULT__'
  - name: CERT_SECRET
    value: '__DEV_WRITER_CERT_SECRET__'
  - name: DEV_TENANT_DOMAIN
    value: '__DEV_TENANT_DOMAIN__'
  - name: DEV_WRITER_APP_ID
    value: '__DEV_WRITER_APP_ID__'

parameters:
  - name: mode
    displayName: Test only reports what would change; Apply changes Dev
    type: string
    default: Test
    values:
      - Test
      - Apply
  - name: workloads
    displayName: 'Workload prefixes to apply, in this order (for example AAD,Intune,EXO,Teams). Leave empty for a Combined compare run.'
    type: string
    default: ''
  - name: includeRemovals
    displayName: Also apply Removals (deletes objects in Dev that PreProd does not have)
    type: boolean
    default: false

pool:
  name: '__POOL__'   # needs pwsh 7.6+ and local admin

stages:
  - stage: ApplyDev
    jobs:
      # An approval and check on the environment '__DEV_ENVIRONMENT__' is the gate before anything is written.
      - deployment: ApplyToDev
        environment: '__DEV_ENVIRONMENT__'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: compare
                  artifact: DriftReport

                - template: templates/install-dependencies.yml

                - task: AzureCLI@2
                  displayName: 'Import Dev Writer certificate'
                  inputs:
                    azureSubscription: $(SERVICECONNECTION)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $env:PE_CERT_PFX_BASE64 = az keyvault secret show --vault-name '$(KEYVAULT_NAME)' --name '$(CERT_SECRET)' --query value -o tsv
                      if ($LASTEXITCODE -ne 0) { throw 'Key Vault read failed.' }
                      & '$(Build.SourcesDirectory)/pipelines/scripts/Connect-PipelineTenant.ps1' -Slug dev -Role Writer `
                          -ApplicationId '$(DEV_WRITER_APP_ID)' -TenantId '$(DEV_TENANT_DOMAIN)'

                # The LCM only runs from Windows PowerShell 5.1; the resources run in PowerShell 7 through its relay.
                - powershell: |
                    $ErrorActionPreference = 'Stop'
                    $report = '$(Pipeline.Workspace)/compare/DriftReport'
                    # Combined run: DriftReport\MOF. PerWorkload run: DriftReport\<Prefix>\MOF, applied in the order given.
                    # The workloads come in through the environment and are validated, never written into the script text.
                    if ($env:PE_WORKLOADS -notmatch '^[A-Za-z0-9,]*$') { throw 'The workloads parameter may only hold letters, digits and commas.' }
                    $roots = @(@($env:PE_WORKLOADS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) | ForEach-Object { Join-Path (Join-Path $report $_) 'MOF' })
                    if ($roots.Count -eq 0) { $roots = @(Join-Path $report 'MOF') }
                    $kinds = @('Changes')
                    if ('${{ parameters.includeRemovals }}' -eq 'True') { $kinds += 'Removals' }   # Changes first, then Removals
                    # With several workloads: all Changes in order first, then all Removals.
                    foreach ($kind in $kinds)
                    {
                        foreach ($root in $roots)
                        {
                            $mof = Get-ChildItem -LiteralPath (Join-Path $root $kind) -Filter *.mof -ErrorAction SilentlyContinue | Select-Object -First 1
                            if (-not $mof) { "No $kind MOF under ${root}: skipped."; continue }
                            "== $kind ($($mof.FullName)) mode ${{ parameters.mode }}"
                            $json = & '$(Build.SourcesDirectory)/tools/Invoke-PELcm.ps1' -MofPath $mof.FullName -Mode '${{ parameters.mode }}'
                            $result = $json | ConvertFrom-Json
                            "In desired state: $(@($result.InDesiredState).Count); not in desired state: $(@($result.NotInDesiredState).Count)"
                            $result.NotInDesiredState | ForEach-Object { "  $($_.ResourceId) $($_.Error)" }
                            if ($result.Error) { throw "LCM error in $kind ($root): $($result.Error)" }
                        }
                    }
                  displayName: '${{ parameters.mode }} MOF files on Dev (LCM)'
                  env:
                    PE_WORKLOADS: ${{ parameters.workloads }}

                # Always runs, so a failed apply does not leave the Writer certificate (LocalMachine) on the agent.
                - pwsh: '& "$(Build.SourcesDirectory)/pipelines/scripts/Disconnect-PipelineTenant.ps1" -Slug dev -Role Writer'
                  displayName: 'Remove Dev Writer certificate from the agent'
                  condition: always()
