name: 'M365DSC - Export PreProd tenant'

trigger: none

# PreProd's tenant, Key Vault and app id are in pipelines/config/PreProd.psd1, read by the script.
parameters:
  - name: workloads
    displayName: Workloads (DSC prefixes, comma separated)
    type: string
    default: 'AAD,Intune,EXO,Teams'

pool:
  name: '__POOL__'   # needs pwsh 7.6+ and local admin

jobs:
  - job: ExportPreProd
    timeoutInMinutes: 180
    steps:
      - checkout: self

      - pwsh: |
          & '$(Build.SourcesDirectory)/pipelines/scripts/Install-PipelineDependencies.ps1'
        displayName: Install PowerShell modules

      - task: AzurePowerShell@5
        displayName: Export PreProd
        inputs:
          azureSubscription: '__SERVICE_CONNECTION__'
          azurePowerShellVersion: LatestVersion
          pwsh: true
          ScriptType: InlineScript
          Inline: |
            & '$(Build.SourcesDirectory)/pipelines/scripts/Invoke-PipelineExport.ps1' -Environment PreProd -Workloads $env:PE_WORKLOADS -OutputPath '$(Build.ArtifactStagingDirectory)/export'
        env:
          PE_WORKLOADS: ${{ parameters.workloads }}

      - pwsh: |
          & '$(Build.SourcesDirectory)/pipelines/scripts/Disconnect-PipelineTenant.ps1' -Slug preprod -Role Reader
        displayName: Remove the certificate from the agent (always runs)
        condition: always()

      - publish: $(Build.ArtifactStagingDirectory)/export
        artifact: PreProdExport
