# Shared steps: export one tenant with Microsoft365DSC and publish the result as an artifact.
parameters:
  - name: tenantSlug          # dev | preprod (the tool's tenant slug)
    type: string
  - name: tenantDomain        # contoso-dev.onmicrosoft.com
    type: string
  - name: applicationId       # Reader app registration
    type: string
  - name: serviceConnection
    type: string
  - name: keyVaultName
    type: string
  - name: certificateSecret   # Key Vault secret holding the Reader certificate as base64 PFX
    type: string
  - name: workloads           # comma-joined DSC name prefixes, for example AAD,Intune,EXO,Teams
    type: string
  - name: artifactName
    type: string

steps:
  - checkout: self

  - template: install-dependencies.yml

  - task: AzureCLI@2
    displayName: 'Sign in app: import Reader certificate (${{ parameters.tenantSlug }})'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $env:PE_CERT_PFX_BASE64 = az keyvault secret show --vault-name '${{ parameters.keyVaultName }}' --name '${{ parameters.certificateSecret }}' --query value -o tsv
        if ($LASTEXITCODE -ne 0) { throw 'Key Vault read failed.' }
        & '$(Build.SourcesDirectory)/pipelines/scripts/Connect-PipelineTenant.ps1' -Slug '${{ parameters.tenantSlug }}' -Role Reader `
            -ApplicationId '${{ parameters.applicationId }}' -TenantId '${{ parameters.tenantDomain }}'

  - pwsh: |
      # The workloads come in through the environment and are validated, never written into the script text.
      if ($env:PE_WORKLOADS -notmatch '^[A-Za-z0-9,]+$') { throw 'The workloads parameter may only hold letters, digits and commas.' }
      $out = Join-Path '$(Build.ArtifactStagingDirectory)' 'export'
      & '$(Build.SourcesDirectory)/tools/Export-M365DscTenant.ps1' -Role Reader -Tenant '${{ parameters.tenantSlug }}' -Workloads $env:PE_WORKLOADS -OutputPath $out
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
    displayName: 'Export ${{ parameters.tenantSlug }} (Microsoft365DSC)'
    env:
      PE_WORKLOADS: ${{ parameters.workloads }}

  - task: PublishPipelineArtifact@1
    displayName: 'Publish ${{ parameters.artifactName }}'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/export'
      artifact: ${{ parameters.artifactName }}
      publishLocation: pipeline
