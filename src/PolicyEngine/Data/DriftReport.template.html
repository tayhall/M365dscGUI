<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PE_TITLE__</title>
<style>
:root { --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #0969da; --good: #1a7f37; --warn: #9a6700; --bad: #cf222e; --focus: #0969da; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4493f8; --good: #3fb950; --warn: #d29922; --bad: #f85149; --focus: #4493f8; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 150px; }
noscript { display: block; padding: 16px; }
h1 { font-size: 22px; margin: 4px 0; }
.muted { color: var(--muted); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.cards { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; min-width: 120px; }
.card .num { font-size: 26px; font-weight: 600; }
.card .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.num.good { color: var(--good); } .num.create { color: var(--good); } .num.update { color: var(--warn); } .num.remove { color: var(--bad); } .num.cannot { color: var(--muted); }
.controls { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.row-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
button, select, input[type=search], input[type=text] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.chip[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
label.inline { display: inline-flex; gap: 6px; align-items: center; }
.sections { display: block; }
.section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.shead { display: flex; gap: 10px; align-items: center; padding: 6px 10px; }
.shead-btn { border: 0; background: none; font-weight: 600; text-align: left; flex: 1; padding: 6px 0; }
.sbody { border-top: 1px solid var(--line); }
.item { border-bottom: 1px solid var(--line); padding: 6px 10px; }
.item:last-child { border-bottom: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pick { width: 20px; display: inline-block; }
.key { font-family: ui-monospace, Consolas, monospace; word-break: break-all; flex: 1 1 200px; }
.wl { font-size: 12px; }
.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 10px; padding: 1px 8px; border: 1px solid currentColor; }
.badge.create { color: var(--good); } .badge.update { color: var(--warn); } .badge.remove { color: var(--bad); } .badge.cannot { color: var(--muted); }
.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
.reason { color: var(--muted); font-size: 13px; padding: 2px 0 2px 30px; }
.diffwrap { overflow-x: auto; padding: 6px 0 4px 30px; }
table.diff { border-collapse: collapse; font-size: 13px; min-width: 520px; }
table.diff th, table.diff td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
td.val { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-width: 420px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.bar .lines { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; max-height: 64px; overflow-y: auto; }
.bar .line { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.bar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.why { color: var(--muted); font-size: 13px; }
@media (max-width: 600px) { main { padding: 12px 16px; padding-bottom: 190px; } .card { min-width: 96px; } }
</style>
</head>
<body>
<main>
<div id="app"><noscript>This report needs JavaScript to select items.</noscript></div>
</main>
<script type="application/json" id="report-data">__PE_DATA__</script>
<script>
__PE_SCRIPT__
</script>
</body>
</html>
