name: 'M365DSC - Export PreProd tenant'

trigger: none

# Environment-specific identifiers (tenant, Key Vault, app id) are in pipelines/config/PreProd.psd1, read at run time.
variables:
  - name: SERVICECONNECTION
    value: '__SERVICE_CONNECTION__'

parameters:
  - name: workloads
    displayName: Workloads (DSC prefixes, comma separated)
    type: string
    default: 'AAD,Intune,EXO,Teams'

pool:
  name: '__POOL__'   # needs pwsh 7.6+ and local admin

stages:
  - stage: Export
    jobs:
      - job: ExportPreProd
        timeoutInMinutes: 180
        steps:
          - template: templates/export-tenant.yml
            parameters:
              environment: PreProd
              serviceConnection: $(SERVICECONNECTION)
              workloads: ${{ parameters.workloads }}
              artifactName: PreProdExport
